<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A refractive digital design exhibition exploring type, color, and liquid glass."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Soft Focus — A Digital Exhibition</title>
  </head>
  <body>
    <canvas id="gallery" aria-hidden="true"></canvas>

    <header class="chrome">
      <button class="clear-button" type="button">Clear</button>
    </header>

    <main class="sr-only">
      <h1>Soft Focus: The Museum of Possible Things</h1>
      <p>
        An experimental digital exhibition about form, feeling, color, and
        objects that only exist when you look through them.
      </p>
      <ul>
        <li>Form follows feeling.</li>
        <li>Design is a social act.</li>
        <li>Look closer. Move slowly. Stay curious.</li>
      </ul>
    </main>

    <div class="loading" role="status">
      <p>Polishing the glass</p>
      <span></span>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
